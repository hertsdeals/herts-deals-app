<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>Herts Deals</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--navy:#0D3B66;--red:#BC1B22;--ink:#1E293B;--text:#475569;--muted:#64748B;--line:#E2E8F0;--soft:#F5F5F5;--pill:#DBE2EA;--chip:#EEF2F7;--r:14px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.prose{-webkit-user-select:text;user-select:text}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3,.serif{font-family:Caudex,Georgia,serif;font-weight:700;letter-spacing:0;color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{position:relative;max-width:480px;height:100%;margin:0 auto;background:#fff;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(84px + var(--sb));background:#fff;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.detail{z-index:20;padding-bottom:calc(40px + var(--sb));animation:in .3s cubic-bezier(.2,.8,.2,1)}
.view.detail.has-cta{padding-bottom:calc(110px + var(--sb))}
.view.leaving{animation:out .22s ease forwards}
@keyframes in{from{transform:translateX(100%)}}
@keyframes out{to{transform:translateX(100%)}}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--st)) 18px 10px;border-bottom:1px solid transparent}
.bar.scrolled{border-color:var(--line)}
.bar .logo{height:38px;width:auto}
.bar h1{margin:0;font-size:22px}
.townbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--pill);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--navy);background:#fff}
.townbtn svg.i{width:15px;height:15px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

/* hero */
.intro{padding:14px 18px 6px}
.intro h2{margin:0 0 6px;font-size:28px;line-height:1.15}
.intro p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.search{margin:14px 18px 4px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--muted);font-size:14px;width:calc(100% - 36px);text-align:left;background:var(--soft)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:0}

/* sections */
.sec{margin-top:30px}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px;margin-bottom:12px}
.sh h3{margin:0;font-size:21px}
.sh a,.sh button{font-size:13px;font-weight:600;color:var(--red)}
.hs{display:flex;gap:14px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scroll-padding-inline:18px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:none}

/* deal card */
.card{width:230px;display:block}
.card .ph{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--chip)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em;padding:6px 9px;border-radius:999px;text-transform:uppercase}
.star{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.save{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.save svg.i{width:16px;height:16px}
.save.on{color:var(--red)}
.save.on svg.i{fill:var(--red)}
.card .who{margin:10px 0 3px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h4{margin:0 0 4px;font-size:14.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.where{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.where svg.i{width:13px;height:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:0 18px}
.grid .card{width:auto}
.grid .card h4{font-size:13.5px}

/* rows */
.rows{padding:0 18px}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.row .th{width:72px;height:72px;border-radius:12px;overflow:hidden;flex:none;background:var(--chip);position:relative}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .tx span{font-size:12.5px;color:var(--muted)}
.row .mini{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:800;color:var(--red);letter-spacing:.03em}
.chev{color:#94A3B8}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--pill);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--navy);background:#fff}
.pill em{font-style:normal;background:var(--chip);border-radius:999px;font-size:11.5px;padding:2px 7px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--pill);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--navy);background:#fff}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* guide cards */
.gcard{width:260px;display:block}
.gcard .cv{aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--navy);position:relative;display:flex;align-items:flex-end;padding:14px}
.gcard .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcard .cv.plain:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(188,27,34,.55)}
.gcard .cv span{position:relative;z-index:1;color:#fff;font-family:Caudex,serif;font-size:20px;font-weight:700;line-height:1.2}
.gcard p{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.glist .gcard{width:auto;margin:0 18px 24px}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px calc(7px + var(--sb))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#94A3B8;padding:4px 10px;position:relative}
.tab.on{color:var(--navy)}
.tab.on svg.i{stroke-width:2.3}
.tab i{position:absolute;top:0;right:8px;background:var(--red);color:#fff;font-style:normal;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}

/* detail pages */
.dtop{position:absolute;top:calc(10px + var(--st));left:14px;right:14px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.dtop>*{pointer-events:auto}
.dtop .g{display:flex;gap:8px}
.cb{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.cb.on{color:var(--red)}
.cb.on svg.i{fill:var(--red)}
.dimg{aspect-ratio:1/1;max-height:420px;width:100%;background:var(--chip);position:relative;overflow:hidden}
.dimg img{width:100%;height:100%;object-fit:cover}
.dimg .badge{left:18px;top:auto;bottom:18px;font-size:13px;padding:8px 12px}
.dbody{padding:20px 18px 0}
.dbody h1{margin:0 0 10px;font-size:26px;line-height:1.2}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin-bottom:18px}
.kv span{display:flex;align-items:center;gap:5px}
.kv svg.i{width:15px;height:15px}
.biz{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%;text-align:left}
.lg{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;background:#fff;flex:none;font-weight:800;color:var(--navy);font-size:15px}
.lg img{width:100%;height:100%;object-fit:contain}
.biz b{display:block;font-size:14.5px;font-weight:600}
.biz span{font-size:12.5px;color:var(--muted)}
.biz .chev{margin-left:auto}
.blk{margin-top:26px}
.blk h3{margin:0 0 10px;font-size:19px}
.prose{color:var(--text);font-size:15px;line-height:1.65}
.prose p{margin:0 0 12px}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--red);font-weight:600;font-size:14px;margin-top:-4px}
.facts{border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.fact{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.fact:last-child{border:0}
.fact svg.i{color:var(--navy);margin-top:1px}
.fact b{display:block;font-weight:600;margin-bottom:2px}
.fact span{color:var(--muted);font-size:13px;line-height:1.45}
details.acc{border-top:1px solid var(--line)}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-weight:600;font-size:15px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary svg.i{transition:transform .2s;color:var(--muted)}
details.acc[open] summary svg.i{transform:rotate(180deg)}
details.acc .prose{padding-bottom:14px;font-size:14px}
.cta{position:absolute;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(12px + var(--sb))}
.cta a{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:999px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.obtn{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--pill);border-radius:999px;padding:11px 12px;font-size:13.5px;font-weight:600;color:var(--navy)}
.obtn svg.i{width:16px;height:16px}

/* business & town heads */
.bcover{height:200px;background:var(--navy);position:relative;overflow:hidden}
.bcover img{width:100%;height:100%;object-fit:cover}
.bcover.plain:after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(188,27,34,.5)}
.bhead{padding:0 18px;margin-top:-34px;position:relative;z-index:2}
.bhead .lg{width:72px;height:72px;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:22px}
.bhead h1{margin:12px 0 4px;font-size:26px;line-height:1.2}
.bhead p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.tband{background:var(--navy);color:#fff;padding:calc(64px + var(--st)) 18px 26px;position:relative;overflow:hidden}
.tband:after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(188,27,34,.45)}
.tband h1{color:#fff;margin:0 0 6px;font-size:30px;position:relative;z-index:1}
.tband p{margin:0;opacity:.85;font-size:13.5px;position:relative;z-index:1}
.tband + .tline{height:4px;background:var(--red)}

/* guide article */
.art{padding:0 18px}
.art h2{font-size:22px;margin:28px 0 8px;line-height:1.25}
.art h3{font-size:18px;margin:20px 0 4px;line-height:1.3;color:var(--navy)}
.art p,.art li{color:var(--text);font-size:15px;line-height:1.65}
.art p{margin:0 0 10px}
.art ul{padding-left:20px;margin:0 0 12px}
.art a{color:var(--navy);text-decoration:underline;text-underline-offset:2px}
.art img{border-radius:var(--r);margin:10px 0}
.art .evd{display:inline-block;margin:22px 0 0;background:var(--chip);color:var(--navy);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px}
.art .evd + h3{margin-top:8px}
.art .ev{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 6px;margin:12px 0}
.art .ev .evd{margin:0}
.art .ev h3{margin:8px 0 4px;font-size:17px}
.art .ev p{margin:0 0 6px;font-size:14px}
.art .ev a{font-weight:600;text-decoration:none;color:var(--red)}

/* misc */
.ttl{padding:calc(14px + var(--st)) 18px 4px}
.ttl h1{margin:0;font-size:30px}
.ttl p{margin:6px 0 0;color:var(--muted);font-size:14px}
.lbl{padding:0 18px;margin:24px 0 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{text-align:center;padding:60px 32px;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;font-family:Caudex,serif;font-size:20px;color:var(--ink);margin-bottom:6px}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.4);z-index:40;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:20px 20px 0 0;max-height:75%;overflow-y:auto;padding:8px 0 calc(16px + var(--sb));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:4px;border-radius:2px;background:#CBD5E1;margin:4px auto 10px}
.sheet h2{margin:0;padding:4px 20px 10px;font-size:21px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 20px;font-size:15px;border-top:1px solid #F1F5F9}
.opt.on{color:var(--red);font-weight:700}
.toast{position:absolute;left:50%;bottom:calc(90px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;z-index:60;white-space:nowrap;animation:fi .2s}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}
.loading img{width:120px;margin-bottom:10px}
.foot{padding:36px 18px 10px;text-align:center;font-size:12px;color:#94A3B8;line-height:1.6}
</style>
</head>

  const bySlug = Object.fromEntries(Object.values(cos).map(c => [c.slug, c.id]));
  deals = D.deals.map(d => {
    let cid = cos[d.company] ? d.company : bySlug[d.slug.replace(/-deal(-\d+)?$/, '')];
    const title = (/[a-z]/.test(d.title) ? d.title : d.title.charAt(0) + d.title.slice(1).toLowerCase());
    const top = d.cats.map(c => cats[c]).filter(Boolean);
    const parent = (top.find(c => !c.parent) || (top[0] && cats[top[0].parent]) || {}).id || 0;
    const sub = top.find(c => c.parent);
    return {...d, title, co: cos[cid] || null, parent, sub};

function cleanGuide(g){
  let h = g.html.replace(/<!--[\s\S]*?-->/g, '');
  const t = g.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  h = h.replace(new RegExp('^\\s*' + t + '\\s*'), '');
  h = h.replace(/<a href="#[^"]*">[^<]*<\/a>/g, '');
  h = h.replace(/<a href="[^"]+\.(jpe?g|png|webp)"><\/a>/gi, '').replace(/<a [^>]*><\/a>/g, '');
  const date = '((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]* \\d{1,2}(?:\\s*(?:-|–|to|&)\\s*\\d{1,2})? [A-Z][a-z]{2,8}[^<]{0,40})';
  h = h.replace(new RegExp('(</a>)\\s*' + date + '\\s*</p>', 'g'), '$1</p><span class="evd">$2</span>');
  h = h.replace(new RegExp('<p>\\s*' + date + '\\s*</p>', 'g'), '<span class="evd">$1</span>');
  h = h.replace(/<p>\s*(<br\s*\/?>\s*)*<\/p>/g, '').replace(/<h2>\s*<\/h2>/g, '');
  // Deal links become in-app deal cards
  const box = document.createElement('div'); box.innerHTML = h;
  const slugs = []; box.querySelectorAll('a[href*="/deal/"]').forEach(a => { const m = a.getAttribute('href').match(/\/deal\/([^/]+)/); if (m && !slugs.includes(m[1])) slugs.push(m[1]); });
  const linked = slugs.map(s => deals.find(d => d.slug === s)).filter(Boolean);
  if (linked.length >= 3) {
    box.querySelectorAll('h3').forEach(x => { if (x.querySelector('a[href*="/deal/"]')) { const n = x.nextElementSibling; if (n && n.tagName === 'P' && n.textContent.trim().length < 40) n.remove(); x.remove(); } });
  }
  const listOnly = linked.length >= 3 && box.textContent.replace(/\s+/g,' ').length < 1500;
  const today = new Date(); today.setHours(0,0,0,0);
  box.querySelectorAll('span.evd').forEach(s => {
    const ev = document.createElement('div'); ev.className = 'ev'; s.before(ev);
    let n = s; while (n && !(n !== s && n.nodeType === 1 && (n.matches('span.evd') || n.tagName === 'H2'))) { const nx = n.nextSibling; ev.appendChild(n); n = nx; }
    const m = s.textContent.match(/(\d{1,2})(?:\s*(?:-|–|to|&)\s*(\d{1,2}))? ([A-Z][a-z]{2})/);
    if (m) { const mi = 'JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(m[3]) / 3; if (mi >= 0) { let y = today.getFullYear(); if (mi < today.getMonth() - 6) y++; const end = new Date(y, mi, +(m[2] || m[1])); if (end < today) ev.remove(); } }
  });
  box.querySelectorAll('h2').forEach(h => { let n = h.nextElementSibling; while (n && n.tagName === 'P' && !n.textContent.trim()) n = n.nextElementSibling; if (!n || n.tagName === 'H2') h.remove(); });
  box.querySelectorAll('a[href^="https://hertsdeals.co.uk/location/"],a[href^="/location/"]').forEach(a => { const s = a.getAttribute('href').match(/location\/([^/]+)/); const t = s && D.towns.find(x => x.slug === s[1]); if (t) a.setAttribute('href', '#town-' + t.id); });
  box.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  return { html: box.innerHTML, linked, listOnly };
}

let detail = false;
function renderTab(){
  const html = ({home:Home, deals:Deals, towns:Towns, guides:Guides, saved:Saved, search:Search}[tab] || Home)();
  root.querySelector('.view[data-tab]')?.remove();
  const v = document.createElement('div'); v.className = 'view'; v.dataset.tab = tab; v.innerHTML = html;
  root.prepend(v);
  v.addEventListener('scroll', () => v.querySelector('.bar')?.classList.toggle('scrolled', v.scrollTop > 4), { passive:true });
  if (tab === 'search') { const q = document.getElementById('q'); q.addEventListener('input', e => runSearch(e.target.value)); setTimeout(() => q.focus(), 50); }
  renderTabs();
}
function renderTabs(){
  const t = [['home','home','Home'],['deals','tag','Deals'],['towns','pin','Towns'],['guides','book','Guides'],['saved','heart','Saved']];
  document.getElementById('tabs').innerHTML = t.map(([k,i,l]) => `<button class="tab ${tab===k?'on':''}" data-go="${k}">${ic(i)}${l}${k==='saved'&&saved.size?`<i>${saved.size}</i>`:''}</button>`).join('');
}
function openDetail(html){ root.querySelectorAll('[data-detail],[data-cta]').forEach(e => e.remove()); root.insertAdjacentHTML('beforeend', html); detail = true; }
function closeDetail(){ root.querySelectorAll('[data-cta]').forEach(e => e.remove()); const v = root.querySelector('[data-detail]'); if (v) { v.classList.add('leaving'); setTimeout(() => v.remove(), 220); } detail = false; }
function route(){
  const h = location.hash.slice(1); let m;
  if ((m = h.match(/^deal-(\d+)$/)) && dealById[m[1]]) return openDetail(DealPage(dealById[m[1]]));
  if ((m = h.match(/^biz-(\d+)$/)) && cos[m[1]]) return openDetail(BizPage(cos[m[1]]));
  if ((m = h.match(/^town-(\d+)$/)) && towns[m[1]]) return openDetail(TownPage(towns[m[1]]));
  if ((m = h.match(/^guide-(\d+)$/))) { const g = guides.find(x => x.id === +m[1]); if (g) return openDetail(GuidePage(g)); }
  const k = ['home','deals','towns','guides','saved','search'].includes(h) ? h : 'home';
  if (k !== tab || !root.querySelector('.view[data-tab]')) { tab = k; renderTab(); }
  if (detail) closeDetail();
}
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.getElementById('shell').appendChild(t); setTimeout(() => t.remove(), 1700); }
function townSheet(){
  const s = document.createElement('div'); s.id = 'sheet';
  const ts = liveTowns();
  s.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet"><div class="grab"></div><h2>Choose your town</h2>
    <button class="opt ${!townSel?'on':''}" data-town="0">All of Hertfordshire ${!townSel?ic('check'):''}</button>
    ${ts.map(t => `<button class="opt ${townSel===t.id?'on':''}" data-town="${t.id}">${esc(t.name)} ${townSel===t.id?ic('check'):''}</button>`).join('')}</div>`;
  document.getElementById('shell').appendChild(s);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-save],[data-go],[data-act],[data-town],[data-cat],[data-share],[data-more]'); if (!el) return;
  if (el.dataset.save) { e.preventDefault(); e.stopPropagation(); const id = +el.dataset.save;
    saved.has(id) ? (saved.delete(id), toast('Removed from Saved')) : (saved.add(id), toast('Saved'));
    store.set('saved', [...saved]); document.querySelectorAll(`[data-save="${id}"]`).forEach(b => b.classList.toggle('on', saved.has(id))); renderTabs();
    if (tab === 'saved' && !detail) renderTab(); return; }
  if (el.dataset.share) { const url = el.dataset.share;
    if (window.hdNative && hdNative.share) hdNative.share(url); else if (navigator.share) navigator.share({ url }).catch(() => {}); else navigator.clipboard?.writeText(url).then(() => toast('Link copied')); return; }
  if (el.dataset.more) { const b = document.getElementById(el.dataset.more); b.classList.remove('clamp'); el.remove(); return; }
  if (el.dataset.go) { location.hash = el.dataset.go; return; }
  if (el.dataset.cat !== undefined) { dealCat = +el.dataset.cat; renderTab(); return; }
  if (el.dataset.town !== undefined) { townSel = +el.dataset.town; store.set('town', townSel); document.getElementById('sheet')?.remove(); renderTab(); return; }
  if (el.dataset.act === 'town') townSheet();
  if (el.dataset.act === 'close') document.getElementById('sheet')?.remove();
  if (el.dataset.act === 'back') { if (history.state && history.state.n || sessionStorage.getItem('hd_nav')) history.back(); else location.hash = tab; }
});
window.addEventListener('hashchange', () => { try { sessionStorage.setItem('hd_nav','1'); } catch(e){} route(); });

function start(data){ window.hdNative && hdNative.ready(); index(data); const h = location.hash.slice(1); if (['deals','towns','guides','saved','search'].includes(h)) tab = h; renderTab(); route(); }
const cached = store.get('feed', null);
if (cached) start(cached);
fetch(FEED, { credentials:'omit' }).then(r => r.json()).then(data => {
  store.set('feed', data);
  if (!cached) start(data); else if (data.generated !== cached.generated) { index(data); if (!detail) renderTab(); }
}).catch(() => { if (cached) return;
  fetch('feed.json').then(r => r.json()).then(start).catch(() => { window.hdNative && hdNative.ready(); root.innerHTML = '<div class="empty"><b>You’re offline</b>Connect to the internet to load local deals.</div>'; }); });
window.hdApp = { isDetail: () => !!detail, closeSheet: () => { const s = document.getElementById('sheet'); if (s) { s.remove(); return true; } return false; }, tab: () => tab };
})();
</script>
<script src="native.js"></script>
</body>
